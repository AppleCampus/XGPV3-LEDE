name: XGPv3 + Photonicat2 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 4'

permissions:
  contents: write

concurrency:
  group: dual-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      synced_sha: ${{ steps.sync.outputs.synced_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    env:
      UPSTREAM_REPO: https://github.com/coolsnowwolf/lede.git
      UPSTREAM_BRANCH: master
    steps:
      - name: Checkout LEDE fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: lede

      - name: Sync latest upstream source
        id: sync
        working-directory: lede
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          custom_dir=/tmp/xgp-custom
          upstream_dir=/tmp/lede-upstream
          rm -rf "$custom_dir" "$upstream_dir"

          for path in \
            .github/workflows/xgp-build.yml \
            feeds.conf.default \
            xgp.config \
            scripts/xgp-prepare.sh \
            scripts/xgp-build.sh \
            scripts/pcat-prepare.sh \
            scripts/pcat-build.sh \
            scripts/xgp-apply-patches.sh; do
            mkdir -p "$custom_dir/$(dirname "$path")"
            cp "$path" "$custom_dir/$path"
          done

          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" "$upstream_dir"
          UPSTREAM_SHA=$(git -C "$upstream_dir" rev-parse HEAD)
          rsync -a --delete --exclude='.git/' "$upstream_dir/" ./

          for path in \
            .github/workflows/xgp-build.yml \
            feeds.conf.default \
            xgp.config \
            scripts/xgp-prepare.sh \
            scripts/xgp-build.sh \
            scripts/pcat-prepare.sh \
            scripts/pcat-build.sh \
            scripts/xgp-apply-patches.sh; do
            mkdir -p "$(dirname "$path")"
            cp "$custom_dir/$path" "$path"
          done

          bash scripts/xgp-apply-patches.sh
          git diff --check
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream LEDE $UPSTREAM_SHA"
          fi
          git push origin HEAD:master
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: xgpv3
            label: XGP V3
            prepare_script: xgp-prepare.sh
            build_script: xgp-build.sh
            image_glob: '*nlnet_xiguapi-v3*.img.gz'
          - id: photonicat2
            label: Photonicat 2
            prepare_script: pcat-prepare.sh
            build_script: pcat-build.sh
            image_glob: '*ariaboard_photonicat2*.img.gz'
    env:
      TZ: Asia/Shanghai
      FORCE_UNSAFE_CONFIGURE: 1
      UPSTREAM_REPO: https://github.com/coolsnowwolf/lede.git
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free more space + show disk
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h
          free -h

      - name: Checkout synced LEDE source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.synced_sha }}
          path: lede

      - name: Install build deps
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev \
            libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip wget curl file swig \
            ccache cmake ninja-build \
            device-tree-compiler patch pkgconf \
            squashfs-tools genisoimage qemu-utils \
            libgmp3-dev libmpfr-dev libmpc-dev \
            uuid-runtime time
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Cache dl / staging
        uses: actions/cache@v4
        with:
          path: |
            lede/dl
            lede/staging_dir/host
            lede/staging_dir/hostpkg
            lede/staging_dir/toolchain-*
          key: ${{ matrix.id }}-${{ runner.os }}-${{ needs.sync.outputs.upstream_sha }}-${{ hashFiles('lede/feeds.conf.default', 'lede/xgp.config') }}
          restore-keys: |
            ${{ matrix.id }}-${{ runner.os }}-

      - name: Prepare ${{ matrix.label }}
        working-directory: lede
        run: |
          set -e
          bash "scripts/${{ matrix.prepare_script }}"
          if [ "${{ matrix.id }}" = "xgpv3" ]; then
            test -f package/zz/luci-app-alpha-config/Makefile
            grep -Fxq 'CONFIG_PACKAGE_luci-app-alpha-config=y' xgp.config
            grep -Fxq 'CONFIG_PACKAGE_luci-theme-alpha=y' xgp.config
          else
            test -f package/lean/pcat-manager/Makefile
            test -f package/lean/pcat-manager-web/Makefile
            test -f package/lean/pcat2-display-mini/Makefile
            test -s .pcat-source-sha
          fi
          df -h

      - name: Preflight XGP compatibility patches
        if: matrix.id == 'xgpv3'
        working-directory: lede
        run: |
          set -euo pipefail
          test -f package/kernel/mac80211/Makefile
          test -f package/kernel/mac80211/realtek.mk
          grep -Fq 'KLIB_BUILD="$(LINUX_DIR)"' package/kernel/mac80211/Makefile
          grep -Fq 'PKG_DRIVERS += rtl8192d-common rtw88-8723x rtw89-8852b-common' package/kernel/mac80211/realtek.mk

      - name: Build ${{ matrix.label }}
        working-directory: lede
        run: |
          set -e
          bash "scripts/${{ matrix.build_script }}"
          df -h

      - name: Collect ${{ matrix.label }} artifacts
        run: |
          set -euo pipefail
          mkdir -p release_assets
          image_pattern="lede/bin/targets/rockchip/armv8/${{ matrix.image_glob }}"
          compgen -G "$image_pattern" >/dev/null
          cp $image_pattern release_assets/

          for manifest in lede/bin/targets/rockchip/armv8/*.manifest; do
            [ -e "$manifest" ] || continue
            cp "$manifest" "release_assets/${{ matrix.id }}-$(basename "$manifest")"
          done

          for metadata in config.buildinfo feeds.buildinfo version.buildinfo sha256sums; do
            source_file="lede/bin/targets/rockchip/armv8/$metadata"
            [ ! -f "$source_file" ] || cp "$source_file" "release_assets/${{ matrix.id }}-$metadata"
          done

          cp lede/.config "release_assets/${{ matrix.id }}.config.final"
          cp lede/feeds.conf "release_assets/${{ matrix.id }}.feeds.conf.final"
          [ ! -s lede/.pcat-source-sha ] || cp lede/.pcat-source-sha release_assets/photonicat-openwrt.source
          cp lede/README.md release_assets/LEDE-README.md || true
          cp lede/LICENSE release_assets/LEDE-LICENSE || true
          curl -fsSL https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt \
            -o release_assets/GPL-2.0.txt

          {
            printf 'AppleCampus/LEDE commit: %s\n' '${{ needs.sync.outputs.synced_sha }}'
            printf 'LEDE upstream: %s@%s\n' "$UPSTREAM_REPO" '${{ needs.sync.outputs.upstream_sha }}'
            printf 'Build target: %s\n' '${{ matrix.label }}'
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ -s lede/.pcat-source-sha ]; then
              printf 'Photonicat packages: https://github.com/photonicat/photonicat_openwrt@%s\n' "$(cat lede/.pcat-source-sha)"
            fi
          } > "release_assets/${{ matrix.id }}-SOURCE-OFFER.txt"

          sha256sum release_assets/*.img.gz > "release_assets/${{ matrix.id }}.sha256sums"
          ls -lah release_assets

      - name: Upload ${{ matrix.label }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-firmware
          path: release_assets/
          if-no-files-found: error

  release:
    needs:
      - sync
      - build
    runs-on: ubuntu-24.04
    steps:
      - name: Download both firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-firmware'
          path: release_assets
          merge-multiple: true

      - name: Verify release contents
        run: |
          set -e
          test -n "$(find release_assets -maxdepth 1 -name '*nlnet_xiguapi-v3*.img.gz' -print -quit)"
          test -n "$(find release_assets -maxdepth 1 -name '*ariaboard_photonicat2*.img.gz' -print -quit)"
          ls -lah release_assets

      - name: Create combined Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-${{ github.run_number }}-${{ github.run_id }}
          target_commitish: ${{ needs.sync.outputs.synced_sha }}
          name: XGPv3 + Photonicat2 ${{ github.run_number }}
          body: |
            ## XGP V3 and Photonicat 2 firmware

            Both images are built from AppleCampus/XGPV3-LEDE commit ${{ needs.sync.outputs.synced_sha }}, after syncing coolsnowwolf/lede commit ${{ needs.sync.outputs.upstream_sha }}.

            - XGP V3 keeps the existing screen, Alpha theme, modem and Wi-Fi customizations.
            - Photonicat 2 includes the official pcat-manager, pcat-manager-web and mini-display packages. The Photonicat WebUI uses port 80 and its OpenWrt entry opens LuCI on port 8080.
            - Photonicat 2 defaults to 172.16.0.1 with root password photonicat, matching the official firmware.

            License and source metadata are included with the images.
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
