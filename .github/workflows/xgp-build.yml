name: XGPv3 + Photonicat2 Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Firmware target
        required: true
        default: all
        type: choice
        options:
          - all
          - photonicat2
          - xgpv3
  schedule:
    - cron: '0 18 * * 4'

permissions:
  contents: write

concurrency:
  group: dual-firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      synced_sha: ${{ steps.sync.outputs.synced_sha }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    env:
      UPSTREAM_REPO: https://github.com/coolsnowwolf/lede.git
      UPSTREAM_BRANCH: master
    steps:
      - name: Checkout LEDE fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: lede

      - name: Sync latest upstream source
        id: sync
        working-directory: lede
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          custom_dir=/tmp/xgp-custom
          upstream_dir=/tmp/lede-upstream
          rm -rf "$custom_dir" "$upstream_dir"

          # Single source of truth for custom files that must survive the
          # upstream `rsync --delete` below. Anything not listed here is
          # replaced or deleted by upstream, so add new custom paths here.
          keep_paths=(
            .github/workflows/xgp-build.yml
            feeds.conf.default
            xgp.config
            scripts/xgp-prepare.sh
            scripts/xgp-build.sh
            scripts/pcat-prepare.sh
            scripts/pcat-build.sh
            scripts/xgp-apply-patches.sh
            scripts/qmodem-fixes.sh
            package/zz
          )

          for path in "${keep_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::warning::Custom path '$path' does not exist; nothing to preserve"
              continue
            fi
            mkdir -p "$custom_dir/$(dirname "$path")"
            cp -a "$path" "$custom_dir/$path"
          done

          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" "$upstream_dir"
          UPSTREAM_SHA=$(git -C "$upstream_dir" rev-parse HEAD)
          # .github/ is never taken from upstream: it holds our workflow, and
          # the GITHUB_TOKEN used for the push below is not allowed to commit
          # changes to workflow files, so any upstream change there would make
          # the push fail.
          rsync -a --delete --exclude='.git/' --exclude='/.github/' "$upstream_dir/" ./

          for path in "${keep_paths[@]}"; do
            [ -e "$custom_dir/$path" ] || continue
            mkdir -p "$(dirname "$path")"
            rm -rf "$path"
            cp -a "$custom_dir/$path" "$path"
          done

          bash scripts/xgp-apply-patches.sh
          # Report whitespace problems in our own files and in the two upstream
          # files patched above, but never fail the sync for them: the diff
          # also contains upstream changes, and upstream whitespace (e.g. in
          # scripts/) used to abort the whole run here with exit code 2.
          if ! git diff --check -- package/kernel/linux/modules/video.mk package/kernel/mac80211/realtek.mk "${keep_paths[@]}"; then
            echo "::warning::git diff --check reported whitespace issues (non-fatal)"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream LEDE $UPSTREAM_SHA"
          fi
          # Push back to the branch this run was started from (master for
          # scheduled runs), so test runs on other branches never touch master.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "synced_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: xgpv3
            label: XGP V3
            prepare_script: xgp-prepare.sh
            build_script: xgp-build.sh
            image_glob: '*nlnet_xiguapi-v3*.img.gz'
          - id: photonicat2
            label: Photonicat 2
            prepare_script: pcat-prepare.sh
            build_script: pcat-build.sh
            image_glob: '*ariaboard_photonicat2*.img.gz'
    env:
      TZ: Asia/Shanghai
      FORCE_UNSAFE_CONFIGURE: 1
      UPSTREAM_REPO: https://github.com/coolsnowwolf/lede.git
    steps:
      - name: Maximize build space
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Free more space + show disk
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h
          free -h

      - name: Checkout synced LEDE source
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.synced_sha }}
          path: lede

      - name: Validate build scripts
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        working-directory: lede
        run: |
          set -euo pipefail
          bash -n scripts/xgp-prepare.sh
          bash -n scripts/xgp-build.sh
          bash -n scripts/pcat-prepare.sh
          bash -n scripts/pcat-build.sh
          bash -n scripts/xgp-apply-patches.sh
          bash -n scripts/qmodem-fixes.sh

      - name: Install build deps
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        run: |
          set -e
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            antlr3 asciidoc autoconf automake autopoint binutils bzip2 cpio \
            gperf haveged help2man intltool libfuse-dev libglib2.0-dev \
            libltdl-dev libpython3-dev libreadline-dev libtool lrzsz \
            p7zip-full scons subversion texinfo uglifyjs xmlto xxd \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev \
            libelf-dev zlib1g-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync unzip wget curl file swig \
            ccache cmake ninja-build \
            device-tree-compiler patch pkgconf \
            squashfs-tools genisoimage qemu-utils \
            libgmp3-dev libmpfr-dev libmpc-dev \
            uuid-runtime time
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      # Only the source download cache is kept. Caching staging_dir alone does
      # not skip the host tools / toolchain build (OpenWrt re-checks them
      # against the freshly checked-out sources), it only wasted cache quota.
      - name: Restore dl cache
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        uses: actions/cache/restore@v4
        with:
          path: lede/dl
          key: dl-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dl-${{ matrix.id }}-

      - name: Prepare ${{ matrix.label }}
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        working-directory: lede
        run: |
          set -e
          bash "scripts/${{ matrix.prepare_script }}"
          if [ "${{ matrix.id }}" = "xgpv3" ]; then
            test -f package/zz/luci-app-alpha-config/Makefile
            grep -Fxq 'CONFIG_PACKAGE_luci-app-alpha-config=y' xgp.config
            grep -Fxq 'CONFIG_PACKAGE_luci-theme-alpha=y' xgp.config
          else
            test -f package/lean/pcat-manager/Makefile
            test -f package/lean/pcat-manager-web/Makefile
            test -f package/lean/pcat2-display-mini/Makefile
            test -s .pcat-source-sha
          fi
          df -h


      - name: Build ${{ matrix.label }}
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        timeout-minutes: 300
        working-directory: lede
        run: |
          set -e
          bash "scripts/${{ matrix.build_script }}"
          df -h

      # Save even when the build fails, otherwise a target that keeps failing
      # (Photonicat 2) never gets a cache.
      - name: Save dl cache
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id)
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: lede/dl
          key: dl-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload ${{ matrix.label }} build logs
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-build-logs
          path: |
            lede/build-logs/
            lede/.config
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Collect ${{ matrix.label }} artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        run: |
          set -euo pipefail
          mkdir -p release_assets
          image_dir="lede/bin/targets/rockchip/armv8"
          image_pattern="${{ matrix.image_glob }}"
          mapfile -t image_files < <(compgen -G "$image_dir/$image_pattern" || true)
          if [ "${#image_files[@]}" -eq 0 ]; then
            mapfile -t image_files < <(find "$image_dir" -maxdepth 1 -type f -name "*.img.gz" -print)
          fi
          if [ "${#image_files[@]}" -eq 0 ]; then
            mapfile -t raw_images < <(find "$image_dir" -maxdepth 1 -type f -name "*.img" -print)
            for raw_image in "${raw_images[@]}"; do
              gzip -9 -c "$raw_image" > "${raw_image}.gz"
              image_files+=("${raw_image}.gz")
            done
          fi
          test "${#image_files[@]}" -gt 0
          cp "${image_files[@]}" release_assets/

          for manifest in lede/bin/targets/rockchip/armv8/*.manifest; do
            [ -e "$manifest" ] || continue
            cp "$manifest" "release_assets/${{ matrix.id }}-$(basename "$manifest")"
          done

          for metadata in config.buildinfo feeds.buildinfo version.buildinfo sha256sums; do
            source_file="lede/bin/targets/rockchip/armv8/$metadata"
            [ ! -f "$source_file" ] || cp "$source_file" "release_assets/${{ matrix.id }}-$metadata"
          done

          cp lede/.config "release_assets/${{ matrix.id }}.config.final"
          cp lede/feeds.conf "release_assets/${{ matrix.id }}.feeds.conf.final"
          [ ! -s lede/.pcat-source-sha ] || cp lede/.pcat-source-sha release_assets/photonicat-openwrt.source
          [ ! -f lede/README.md ] || cp lede/README.md release_assets/LEDE-README.md
          [ ! -f lede/LICENSE ] || cp lede/LICENSE release_assets/LEDE-LICENSE
          echo "GPL-2.0 license text: https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt" > release_assets/GPL-2.0-LICENSE-INFO.txt

          {
            printf 'AppleCampus/LEDE commit: %s\n' '${{ needs.sync.outputs.synced_sha }}'
            printf 'LEDE upstream: %s@%s\n' "$UPSTREAM_REPO" '${{ needs.sync.outputs.upstream_sha }}'
            printf 'Build target: %s\n' '${{ matrix.label }}'
            printf 'Build run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ -s lede/.pcat-source-sha ]; then
              printf 'Photonicat packages: https://github.com/photonicat/photonicat_openwrt@%s\n' "$(cat lede/.pcat-source-sha)"
            fi
          } > "release_assets/${{ matrix.id }}-SOURCE-OFFER.txt"

          sha256sum release_assets/*.img.gz > "release_assets/${{ matrix.id }}.sha256sums"
          ls -lah release_assets

      - name: Upload ${{ matrix.label }} artifact
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-firmware
          path: release_assets/
          if-no-files-found: error

      - name: Release XGP V3 firmware
        # Only publish from master; test runs on other branches stop at the artifact upload.
        if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id) && matrix.id == 'xgpv3'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xgpv3-${{ github.run_number }}-${{ github.run_id }}
          target_commitish: ${{ needs.sync.outputs.synced_sha }}
          name: XGP V3 firmware ${{ github.run_number }}
          body: |
            XGP V3 firmware built from AppleCampus/XGPV3-LEDE commit ${{ needs.sync.outputs.synced_sha }}, after syncing coolsnowwolf/lede commit ${{ needs.sync.outputs.upstream_sha }}.

            This release is independent of the Photonicat 2 build. A Photonicat failure does not block or remove the XGP V3 release.
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Photonicat 2 firmware
        if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.id) && matrix.id == 'photonicat2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: photonicat2-${{ github.run_number }}-${{ github.run_id }}
          target_commitish: ${{ needs.sync.outputs.synced_sha }}
          name: Photonicat 2 firmware ${{ github.run_number }}
          body: |
            Photonicat 2 firmware built from AppleCampus/XGPV3-LEDE commit ${{ needs.sync.outputs.synced_sha }}, after syncing coolsnowwolf/lede commit ${{ needs.sync.outputs.upstream_sha }}.

            This release is independent of the XGP V3 build.
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
